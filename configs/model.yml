xgboost:
  n_estimators: 1000
  max_depth: 6
  learning_rate: 0.05
  subsample: 0.8
  colsample_bytree: 0.8
  tree_method: "hist"
  random_state: 42
  n_jobs: -1

lightgbm:
  n_estimators: 1000
  num_leaves: 31
  learning_rate: 0.05
  feature_fraction: 0.8
  bagging_fraction: 0.8
  random_state: 42
  n_jobs: -1

catboost:
  iterations: 1000
  depth: 6
  learning_rate: 0.05
  random_seed: 42
  verbose: 100
  allow_writing_files: false
