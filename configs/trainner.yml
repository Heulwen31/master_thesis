pipeline:
  mode: "subsample"   # Options: "subsample", "full" (Nếu đã chạy run_undersampling.sh thì file gốc đã được giảm mẫu)
  init_train_size: 10000
  subsample_size: 20000
  sampling:
    target_majority_ratio: 0.90 # Lớp đa số chiếm n%
    min_total_samples: 50000    # Số mẫu tối thiểu giữ lại

sliding:
  window_size: 5000
  retrain_interval: 50

periodic:
  retrain_interval: 5000 # Tăng từ 1000: Long-term full retrain interval (ít cập nhật, học dữ liệu lớn)

incremental:
  update_interval: 100    # Huấn luyện lại lớp thích nghi mỗi 100 giao dịch
  adaptive_window: 1000   # Bộ dữ liệu gần đây khoảng 1000 dòng để thích nghi
  update_trees: 20        # Số lượng cây học thêm trên 1000 dòng này

hybrid:
  gate_threshold: 0.02    # Ngưỡng tin cậy (nếu xác suất mô hình ổn định < 0.02 thì tin tưởng 100% mô hình ổn định)
  weight_adaptive: 0.3    # Trọng số của lớp Adaptive Layer khi kết hợp (GBDT stable = 0.7)
