pipeline:
  mode: "full" # Options: "subsample", "full"
  init_train_size: 10000
  subsample_size: 30000
  sampling:
    target_majority_ratio: 0.90 # Lớp đa số chiếm n%
    min_total_samples: 50000    # Số mẫu tối thiểu giữ lại

sliding:
  window_size: 1000
  retrain_interval: 200

periodic:
  retrain_interval: 5000 # Tăng từ 1000: Long-term full retrain interval (ít cập nhật, học dữ liệu lớn)

incremental:
  algorithm: "ARF"             # ARF, HAT, LeveragingBagging
  n_models: 20                 # more trees → robust ensemble for imbalanced data
  lambda_value: 10             # Poisson lambda for bootstrap weights
  grace_period: 200            # wait longer before splitting (more stable)
  split_criterion: "gini"      # gini > info_gain for imbalanced data
  leaf_prediction: "nba"       # Naive Bayes Adaptive (default)
  max_depth: null              # unlimited depth
  impute_nan: true             # auto-fill NaN → 0
  fraud_weight: "auto"         # "auto" = inverse frequency (capped 100), or int

  dataset_overrides:
    ieee_cis:
      algorithm: "LeveragingBagging"
      n_models: 10
      lambda_value: 6
      grace_period: 500
      fraud_weight: "auto"
    fraud_ecommerce:
      n_models: 20
      grace_period: 300


hybrid:
  # Default params — tuned on creditcard (29 features, 0% NaN, 0.17% fraud)
  boost_mode: "auc_boost"       # auc_boost | signal_gated | legacy_soft_or | and_fusion
  intervention_threshold: 0.128 # p_short > threshold
  min_p_long_for_boost: 0.05    # chỉ boost khi long không quá tự tin (legit ~0)
  max_p_long_for_boost: 1.0
  tiebreak_epsilon: 1.0e-7      # phá tie ranking nhẹ
  short_weight: 1.0
  incremental_margin: 0.02      # cho signal_gated
  require_stress_for_boost: false
  alpha: 0.01
  monitor_window: 500
  min_monitor_samples: 100
  accuracy_drop_threshold: 0.05
  min_rolling_accuracy: null
  error_burst_multiplier: 2.5
  min_error_rate_for_burst: 0.02
  use_brier_stress: true        # Stress khi Brier(long) tăng — gắn với chất lượng score
  brier_increase_ratio: 0.12    # rolling_brier >= ema_brier * (1 + ratio)
  stress_cooldown: 300
  river_n_models: 5             # small ARF — đủ cho ít features
  river_lambda_value: 6
  river_grace_period: 50
  river_split_criterion: "info_gain"
  river_algorithm: "ARF"        # Thêm mới: ARF, HAT, LeveragingBagging
  and_long_threshold: 0.05      # and_fusion: long threshold
  prior_ratio: null             # auto-computed from init data if null
  short_max_features: null      # null = dùng tất cả features
  impute_nan: false             # mặc định tắt (creditcard 0% NaN)

  # Per-dataset overrides — merged on top of defaults at runtime
  dataset_overrides:
    ieee_cis:
      # 371 features, 30% NaN, ~10% fraud → ARF cần capacity gấp ~10x
      river_n_models: 50
      river_lambda_value: 60
      river_grace_period: 200
      short_max_features: 100
      impute_nan: true
