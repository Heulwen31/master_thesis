pipeline:
  mode: "full" # Options: "subsample", "full"
  init_train_size: 10000
  subsample_size: 30000
  sampling:
    target_majority_ratio: 0.90 # Lớp đa số chiếm n%
    min_total_samples: 50000    # Số mẫu tối thiểu giữ lại

sliding:
  window_size: 1000
  retrain_interval: 200

periodic:
  retrain_interval: 5000 # Tăng từ 1000: Long-term full retrain interval (ít cập nhật, học dữ liệu lớn)

incremental:
  update_interval: 200  # Tăng từ 100: Tăng số lượng mẫu thu thập trước khi cập nhật ngắn hạn
  update_trees: 1000       # Giảm từ 500: Số lượng cây mới thêm vào (giảm bớt để tránh phình mô hình)

hybrid:
  # auc_boost: tuned on creditcard 50k test — beats periodic ROC+PR (grid search)
  boost_mode: "auc_boost"       # auc_boost | signal_gated | legacy_soft_or | and_fusion
  intervention_threshold: 0.128 # p_short > threshold
  min_p_long_for_boost: 0.05    # chỉ boost khi long không quá tự tin (legit ~0)
  max_p_long_for_boost: 1.0
  tiebreak_epsilon: 1.0e-7      # phá tie ranking nhẹ
  short_weight: 1.0
  incremental_margin: 0.02      # cho signal_gated
  require_stress_for_boost: false
  alpha: 0.01
  monitor_window: 500
  min_monitor_samples: 100
  accuracy_drop_threshold: 0.05
  min_rolling_accuracy: null
  error_burst_multiplier: 2.5
  min_error_rate_for_burst: 0.02
  use_brier_stress: true        # Stress khi Brier(long) tăng — gắn với chất lượng score
  brier_increase_ratio: 0.12    # rolling_brier >= ema_brier * (1 + ratio)
  stress_cooldown: 300
  # IEEE-CIS optimized (371 features, 30% NaN): more trees, wider splits
  river_n_models: 50            # 5 → 50: more ensemble coverage for high-D
  river_lambda_value: 60        # 6 → 60: consider ~16% of features per split
  river_grace_period: 200       # 50 → 200: more stats before splitting
  river_split_criterion: "info_gain"

  # and_fusion: conservative AND-gate fusion for extreme imbalance
  and_long_threshold: 0.05    # long must also be > this for AND boost
  prior_ratio: null           # auto-computed from init data if null

  # Short model input preparation (critical for high-D / NaN-rich data)
  short_max_features: 100       # limit ARF to top-100 features (by long model importance)
  impute_nan: true              # replace NaN with 0 before short model

