pipeline:
  mode: "full" # Options: "subsample", "full" (Nếu đã chạy run_undersampling.sh thì file gốc đã được giảm mẫu)
  init_train_size: 1000
  subsample_size: 10000
  sampling:
    target_majority_ratio: 0.90 # Lớp đa số chiếm n%
    min_total_samples: 50000    # Số mẫu tối thiểu giữ lại

sliding:
  window_size: 1000
  retrain_interval: 10
  max_models: 5

periodic:
  retrain_interval: 1000 # Tăng từ 1000: Long-term full retrain interval (ít cập nhật, học dữ liệu lớn)

incremental:
  update_interval: 200  # Tăng từ 100: Tăng số lượng mẫu thu thập trước khi cập nhật ngắn hạn
  update_trees: 1000       # Giảm từ 500: Số lượng cây mới thêm vào (giảm bớt để tránh phình mô hình)

hybrid:
  short_term_method: "sliding" # Options: "sliding", "incremental"
  similarity_threshold: 0.1  # Threshold for direct model selection
  k_neighbors: 3             # Number of neighbors for weighted ensemble
  weight_short: 1.0
  weight_long: 2.0
  use_metaheuristic: true    # Enable metaheuristic optimization
  metaheuristic_metric: "f1" # Metric to optimize: "f1", "log_loss"
  metaheuristic_bounds:      # Search space for [weight_short, weight_long]
    weight_short: [0.1, 5.0]
    weight_long:  [0.1, 5.0]
