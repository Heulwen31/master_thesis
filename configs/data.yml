standard_names:
  time: "time"
  target: "target"

datasets:
  creditcard:
    raw_path: "data/raw/creditcard/creditcard.csv"
    column_mapping:
      Time: "time"
      Class: "target"
    id_column: null

  ieee_cis:
    raw_path: "data/raw/ieee_cis_fraud/train_transaction.csv"
    identity_path: "data/raw/ieee_cis_fraud/train_identity.csv"
    column_mapping:
      TransactionID: "id"
      TransactionDT: "time"
      isFraud: "target"
    id_column: "TransactionID"
    null_threshold: 0.8  # Loại bỏ feature nếu tỷ lệ null > 80%

  fraud_ecommerce:
    raw_path: "data/raw/fraud_ecommerce/Fraud_Data.csv"
    mapping_path: "data/raw/fraud_ecommerce/IpAddress_to_Country.csv"
    column_mapping:
      purchase_time: "time"
      class: "target"
    id_column: "user_id"



standard_columns:
  - "id"
  - "time"
  - "target"

# Undersampling configuration for imbalanced data
undersampling:
  enabled: false  # Set to true to enable undersampling
  method: "time_aware"  # Options: "time_aware", "stratified_window", "recency_biased"
  sampling_ratio: 0.5   # Fraction of majority class to keep (0 < ratio <= 1)
  
  # For stratified window method
  window_size: 5000     # Number of samples per time window
  
  # For recency biased method
  recency_weight: 0.7   # How much to favor recent samples (0-1, higher = more recent)
  
  minority_label: 1     # Label value for minority class (fraud)
  seed: 42              # Random seed for reproducibility
